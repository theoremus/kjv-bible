project:
  type: book
  output-dir: _site

profile:
  group:
    - [html, law, history, wisdom, major-prophets, minor-prophets, gospels, epistles]

book:
  title: "The Holy Bible"
  site-url: https://theoremus.github.io/kjv-bible/
  output-file: The-Holy-Bible
  downloads: [pdf]

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
  pdf:
    documentclass: memoir
    classoption: [twoside, openany]
    geometry: [a5paper, margin=1in]
    mainfont: "EB Garamond"
    include-in-header:
      text: |
        \usepackage{lettrine} % For drop caps
        \usepackage{scripture} % For scripture formatting
        % Legacy content uses \begin{scripture}[Book][Chapter]; newer scripture
        % versions accept one reference argument followed by key-value options.
        \let\legacyScripture\scripture
        \let\endlegacyScripture\endscripture
        \RenewDocumentEnvironment{scripture}{O{} O{}}{%
          \if\relax\detokenize{#2}\relax
            \legacyScripture[#1]%
          \else
            \legacyScripture[#1\space #2]%
          \fi
        }{\endlegacyScripture}
        \usepackage{xcolor} % Optional: for colored drop caps
        \setlength{\columnsep}{0.25in}
        \scripturesetup{
          verse/format = {\bfseries\textsuperscript{#1}}, % Ensure braces wrap the whole thing
          verse/sep = 0.1em
        }
        \input{Zallman.fd}
        \newcommand*{\initfamily}{\usefont{U}{Zallman}{xl}{n}}
        \renewcommand{\LettrineFontHook}{\initfamily}
        \setlength{\DefaultNindent}{1em}
        



